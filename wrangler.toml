# Déploiement Cloudflare Workers — Secourisme Pour Tous
#
# Sans ce fichier, Cloudflare ne connaissait aucune route dynamique : le dossier
# `functions/` (convention Cloudflare *Pages*) était ignoré et /api/contact
# répondait 404. Les formulaires postaient dans le vide.
#
# `name` doit rester identique au Worker existant, sinon le déploiement en crée
# un second et l'ancienne adresse continue de servir l'ancien code.

name = "secourismepourtous"
main = "worker/index.js"
compatibility_date = "2026-08-21"

# Le site statique produit par Astro. Cloudflare le sert avant d'appeler le
# Worker : celui-ci ne voit que ce qui ne correspond à aucun fichier.
[assets]
directory = "./dist"
binding = "ASSETS"

# Sans cette ligne, /api/contact répond 405 aux navigateurs et 303 à curl.
# Le routeur de fichiers statiques traite toute requête portant
# « Sec-Fetch-Mode: navigate » comme une demande de fichier et ne passe jamais
# la main au Worker. Or un formulaire HTML soumis normalement EST une
# navigation — contrairement à un fetch ou à curl, ce qui rend la panne
# invisible aux tests en ligne de commande.
run_worker_first = ["/api/*"]

# Astro produit des fichiers plats (`build.format: 'file'`) : /formations doit
# résoudre vers formations.html. C'est ce que fait « auto-trailing-slash ».
html_handling = "auto-trailing-slash"

# Une URL inconnue rend notre page 404, pas celle de Cloudflare.
not_found_handling = "404-page"

# L'identifiant du site n'est pas un secret : c'est un numéro, inutilisable
# sans la clé, et Wix l'expose lui-même dans ses intégrations. Le déclarer ici
# évite d'avoir à le saisir à la main dans le tableau de bord, et ramène à un
# seul le nombre de secrets à poser.
[vars]
WIX_SITE_ID = "c76f219b-29ee-4805-aae5-8f78da0f719f"

# WIX_API_KEY, en revanche, est une clé administrateur : elle n'a rien à faire
# dans un fichier versionné. Elle se pose en secret d'exécution, par le tableau
# de bord (Settings > Variables and secrets) ou par
# `npx wrangler secret put WIX_API_KEY`.
